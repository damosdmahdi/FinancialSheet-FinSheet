# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# =============================================================
# JVM & Daemon Memory (naik dari 2GB → 4GB untuk Compose + KSP)
# G1GC lebih stabil untuk workload build Android daripada default GC
# =============================================================
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# =============================================================
# Kotlin Daemon — pakai JVM args yang sama agar tidak OOM
# =============================================================
kotlin.daemon.jvm.options=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# =============================================================
# Build Performance
# =============================================================
# Jalankan module secara paralel (aman untuk single-module project)
org.gradle.parallel=true

# Gradle Build Cache — skip recompile jika tidak ada perubahan
org.gradle.caching=true

# Daemon idle timeout: 1 jam (default 3 jam, terlalu lama → zombie daemon)
org.gradle.daemon.idletimeout=3600000

# =============================================================
# Android / Kotlin
# =============================================================
kotlin.code.style=official
android.disallowKotlinSourceSets=false

# Non-transitive R classes — kurangi ukuran compile classpath
android.nonTransitiveRClass=true

# AndroidX — wajib aktif
android.useAndroidX=true
